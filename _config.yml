# Site Settings
title: "Bruno Batarelo"
name: "Bruno Batarelo"
description: "Senior Scala/backend engineer transitioning toward Rust. Distributed systems, production architecture, and engineering leadership — plus mechanical, embedded, and audio/MIDI work."
url: "https://bruno.batarelo.net"
baseurl: ""

# Build Settings
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# SEO
twitter:
  username: ""
og_image: /assets/images/bio-photo.jpg

# Site Author
author:
  name: "Bruno Batarelo"
  bio: "Senior Scala / backend / distributed-systems engineer transitioning toward Rust, with a broader engineering background spanning software, embedded systems, mechanical work, and product development."
  location: "Croatia"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bbatarelo"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/bruno-batarelo-271a869/"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:bruno@batarelo.net"

# Reading Files
include:
  - .htaccess
  - _pages

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache
  - .sass-cache
  - _site
  - README.md
  - LICENSE

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Europe/Zagreb

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
